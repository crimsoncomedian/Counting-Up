<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Counting Up — Subtraction</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#192336}.app{max-width:850px;margin:24px auto;padding:24px;background:white;border:1px solid #dce3ef;border-radius:20px;box-shadow:0 8px 30px #15213b0a}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;font-weight:700}h1{font-size:clamp(28px,5vw,40px);margin:6px 0 14px}.panel{background:#f0f5fc;border-radius:13px;padding:15px;margin:14px 0}.status{font-weight:700}.sub{color:#52637b;font-size:14px;margin-top:5px}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin:18px 0}.metric{padding:12px 5px;background:#f0f5fc;border-radius:12px}.metric small{display:block;color:#52637b}.metric strong{display:block;font-size:clamp(21px,5vw,32px);margin-top:4px}.metric strong.blue{color:#2373cf}.metric strong.green{color:#16825a}.chart{overflow:hidden;border:1px solid #e0e6ef;border-radius:14px;padding:8px 3px 0}svg{width:100%;height:auto;display:block}form{display:flex;align-items:end;gap:10px;margin:17px 0}label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #b6c4d8;border-radius:10px;font-size:20px;color:#192336;background:white}button{padding:12px 17px;border:1px solid #c7d1e0;border-radius:10px;background:white;color:#192336;font-weight:700;cursor:pointer}button.primary{background:#246fca;color:white;border-color:#246fca}button:disabled{opacity:.45;cursor:not-allowed}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.message{min-height:23px;font-size:14px;color:#bd3030}.complete{display:none;text-align:center}.complete h2{color:#16825a;margin:8px 0}.complete .sum{font-size:clamp(20px,4vw,28px);font-weight:750;overflow-wrap:anywhere}.legend{text-align:center;font-size:13px;color:#52637b;margin-top:6px}@media(max-width:520px){.app{margin:0;border:0;border-radius:0;padding:15px}.metrics{gap:5px}.metric{padding:10px 2px}button{padding:11px 12px}form{gap:7px}}@media(prefers-color-scheme:dark){body{background:#0c111b;color:#e8eef8}.app{background:#141d2c;border-color:#303c50}.panel,.metric{background:#202e42}.chart{border-color:#334155}button{background:#202e42;color:#e8eef8;border-color:#52617a}button.primary{background:#3381e0;border-color:#3381e0}input{background:#101a29;color:#e8eef8;border-color:#52617a}.eyebrow,.sub,.metric small,.legend{color:#a7b6cb}}
</style></head><body><main class="app"><header><div class="eyebrow">Counting up · Subtraction</div><button id="new" type="button">New problem ↻</button></header><h1 id="problem">83 − 47 = ?</h1><section class="panel"><div class="status" id="instruction">Choose where to land first.</div><div class="sub" id="hint">Your first landing point must be before the target.</div></section><div class="metrics"><div class="metric"><small>You are at</small><strong class="blue" id="current">47</strong></div><div class="metric"><small>Next landing</small><strong id="preview">—</strong></div><div class="metric"><small>Your target</small><strong class="green" id="target">83</strong></div></div><div class="chart"><svg id="line" viewBox="0 0 760 270" role="img" aria-label="Number line showing your jumps"></svg><div class="legend">The number line shows every landing point and jump.</div></div><form id="form"><div style="flex:1;min-width:0"><label for="landing">Where do you want to land?</label><input id="landing" type="number" inputmode="numeric" step="1" placeholder="Enter a number" autocomplete="off"></div><button class="primary" id="jump" type="submit">Jump →</button></form><div class="message" id="message" role="status" aria-live="polite"></div><section class="panel complete" id="complete"><h2>✓ You reached the target!</h2><div class="sum" id="sum"></div><p id="result"></p><button class="primary" id="next" type="button">Next problem →</button></section><div class="controls"><button id="undo" type="button">↶ Undo jump</button><button id="reset" type="button">Start over</button></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let start=47,target=83,landings=[];const current=()=>landings.length?landings[landings.length-1]:start;const jumps=()=>landings.map((n,i)=>n-(i?landings[i-1]:start));const NS='http://www.w3.org/2000/svg';function el(tag,attrs={},text){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text!==undefined)node.textContent=text;return node}function draw(){const svg=$('line');svg.replaceChildren();const x=n=>36+(n-start)/(target-start)*688;const base=190;svg.append(el('line',{x1:36,y1:base,x2:724,y2:base,stroke:'#8493a8','stroke-width':3}));for(let n=Math.ceil(start/10)*10;n<target;n+=10){if(n<=start)continue;const xx=x(n);svg.append(el('line',{x1:xx,y1:base-5,x2:xx,y2:base+6,stroke:'#8493a8','stroke-width':1.5}));svg.append(el('text',{x:xx,y:base+30,'text-anchor':'middle',fill:'#8995a8','font-size':14},n))}const points=[start,...landings];for(let i=0;i<landings.length;i++){const a=points[i],b=points[i+1],xa=x(a),xb=x(b),mid=(xa+xb)/2;const arcHeight=Math.min(95,35+(xb-xa)*.22);svg.append(el('path',{d:`M ${xa} ${base-8} Q ${mid} ${base-8-arcHeight*2} ${xb} ${base-8}`,fill:'none',stroke:'#3388e1','stroke-width':4,'stroke-linecap':'round'}));svg.append(el('text',{x:mid,y:34,'text-anchor':'middle',fill:'#3388e1','font-size':19,'font-weight':700},'+'+(b-a)))}for(const [i,n] of points.entries()){const xx=x(n);svg.append(el('circle',{cx:xx,cy:base,r:i===points.length-1?7:5,fill:'#3388e1'}));svg.append(el('text',{x:xx,y:base+59,'text-anchor':'middle',fill:'#3388e1','font-size':18,'font-weight':700},n))}if(current()!==target){svg.append(el('circle',{cx:x(target),cy:base,r:6,fill:'none',stroke:'#16825a','stroke-width':3}));svg.append(el('text',{x:x(target),y:base+59,'text-anchor':'middle',fill:'#16825a','font-size':18,'font-weight':700},target))}svg.setAttribute('aria-label',`From ${start} to ${target}. Landings: ${points.join(', ')}. Jumps: ${jumps().join(', ')||'none yet'}.`)}function update(){const done=current()===target;$('problem').textContent=`${target} − ${start} = ?`;$('current').textContent=current();$('target').textContent=target;$('instruction').textContent=done?'You reached your target!':landings.length?`You are at ${current()}. Choose your next landing point.`:'Choose where to land first.';$('hint').textContent=done?'Add your jumps to find the difference.':landings.length?`Choose a whole number greater than ${current()} and no greater than ${target}.`:`Choose a whole number greater than ${start} but less than ${target}.`;$('undo').disabled=!landings.length;$('reset').disabled=!landings.length;$('form').style.display=done?'none':'flex';$('complete').style.display=done?'block':'none';if(done){$('sum').textContent=jumps().join(' + ')+' = '+(target-start);$('result').textContent=`${target} − ${start} = ${target-start}`;}preview();draw()}function preview(){const raw=$('landing').value.trim();const n=Number(raw),valid=raw!==''&&Number.isInteger(n)&&n>current()&&n<=target&&!(landings.length===0&&n===target);$('preview').textContent=valid?n:'—';$('jump').disabled=!valid}function submit(e){e.preventDefault();const raw=$('landing').value.trim(),n=Number(raw);if(!raw||!Number.isInteger(n)){msg('Enter a whole number.');return}if(n<=current()){msg(`Choose a number greater than ${current()}.`);return}if(n>target){msg(`You cannot go past ${target}.`);return}if(!landings.length&&n===target){msg('Use at least two jumps to reach the target.');return}landings.push(n);$('landing').value='';msg('');update()}function msg(t){$('message').textContent=t}function reset(){landings=[];$('landing').value='';msg('');update()}function next(){let a,b;do{a=20+Math.floor(Math.random()*60);b=a+15+Math.floor(Math.random()*45)}while(a%10>=b%10||a===start&&b===target);start=a;target=b;reset()}$('form').addEventListener('submit',submit);$('landing').addEventListener('input',preview);$('undo').addEventListener('click',()=>{landings.pop();$('landing').value='';msg('');update()});$('reset').addEventListener('click',reset);$('new').addEventListener('click',next);$('next').addEventListener('click',next);update();})();
</script></body></html>
